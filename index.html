<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAVE FC 출석 및 회원 관리</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f1f3f6;--bg2:#fff;--bg3:#e9ecf0;--bg-hover:#f7f8fa;
  --text:#1a1d23;--text2:#3a3f4b;--text3:#6b7280;
  --accent:#2563eb;--accent-light:rgba(37,99,235,.08);
  --border:#dfe2e8;
  --green:#16a34a;--green-bg:rgba(22,163,74,.1);
  --red:#dc2626;--red-bg:rgba(220,38,38,.08);
  --yellow:#ca8a04;--yellow-bg:rgba(202,138,4,.1);
  --orange:#c2410c;--orange-bg:rgba(194,65,12,.1);
  --darkred:#991b1b;--darkred-bg:rgba(153,27,27,.12);
  --shadow:0 1px 3px rgba(0,0,0,.06);--shadow2:0 4px 24px rgba(0,0,0,.08);
  --radius:12px;--modal-bg:rgba(0,0,0,.35);
}
[data-theme="dark"]{
  --bg:#111318;--bg2:#1a1d25;--bg3:#23272f;--bg-hover:#282c36;
  --text:#eaecf0;--text2:#cdd2da;--text3:#a3aab6;
  --accent:#3b82f6;--accent-light:rgba(59,130,246,.12);
  --border:#2a2e38;
  --green:#22c55e;--green-bg:rgba(34,197,94,.14);
  --red:#f87171;--red-bg:rgba(248,113,113,.12);
  --yellow:#facc15;--yellow-bg:rgba(250,204,21,.12);
  --orange:#fb923c;--orange-bg:rgba(251,146,60,.15);
  --darkred:#ef4444;--darkred-bg:rgba(239,68,68,.18);
  --shadow:0 1px 3px rgba(0,0,0,.25);--shadow2:0 4px 24px rgba(0,0,0,.4);
  --modal-bg:rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}
.container{max-width:1260px;margin:0 auto;padding:0 16px}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 0;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),#1d4ed8);color:#fff;font-size:22px;font-weight:800}
.logo-text h1{font-size:18px;font-weight:800;color:var(--text)}
.logo-text p{font-size:11px;color:var(--text3);margin-top:1px}
.header-actions{display:flex;gap:8px;align-items:center}
.theme-toggle{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center;transition:.2s}
.theme-toggle:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.conn-status{display:flex;align-items:center;gap:6px;font-size:11px;padding:5px 12px;border-radius:8px;font-weight:600}
.conn-online{background:var(--green-bg);color:var(--green)}.conn-offline{background:var(--red-bg);color:var(--red)}
.conn-dot{width:7px;height:7px;border-radius:50%;animation:pulse 2s infinite}
.conn-online .conn-dot{background:var(--green)}.conn-offline .conn-dot{background:var(--red)}
.tabs{display:flex;gap:3px;background:var(--bg2);border-radius:12px;padding:4px;margin:20px 0;border:1px solid var(--border);box-shadow:var(--shadow);flex-wrap:wrap}
.tab-btn{flex:1;padding:10px 6px;border:none;border-radius:9px;font-size:13px;font-weight:600;background:transparent;color:var(--text2);transition:.2s;min-width:70px;white-space:nowrap}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.25)}
.tab-btn:not(.active):hover{background:var(--accent-light);color:var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:16px;border:1px solid var(--border);box-shadow:var(--shadow)}
.stat-label{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:4px}
.stat-value{font-size:24px;font-weight:800}
.stat-value.blue{color:var(--accent)}.stat-value.green{color:var(--green)}.stat-value.yellow{color:var(--yellow)}
.btn{border:none;border-radius:8px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:8px 16px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.1)}
.btn-secondary{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}.btn-secondary:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.btn-danger{background:var(--red-bg);color:var(--red)}.btn-warning{background:var(--orange-bg);color:var(--orange)}
.btn-sm{font-size:12px;padding:5px 11px}
.btn-ghost{background:transparent;color:var(--text3);padding:6px 10px}.btn-ghost:hover{color:var(--accent);background:var(--accent-light)}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);background:var(--bg2)}
table{width:100%;border-collapse:collapse;min-width:600px}
thead th{padding:10px 8px;font-size:11px;font-weight:700;color:var(--text3);text-align:center;white-space:nowrap;background:var(--bg);border-bottom:1px solid var(--border)}
tbody td{padding:8px;text-align:center;font-size:13px;border-bottom:1px solid var(--border);color:var(--text)}
tbody tr:hover td{background:var(--bg-hover)}tbody tr:last-child td{border-bottom:none}
.name-cell{text-align:left!important;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--text)}.name-cell:hover{color:var(--accent)}
.session-header{cursor:pointer;min-width:76px}
.session-date{font-size:12px;font-weight:700;color:var(--text)}.session-venue{font-size:10px;color:var(--text3);margin-top:1px}.session-count{font-size:10px;color:var(--accent);margin-top:2px;font-weight:700}
.session-rate{font-size:11px;font-weight:800;margin-top:2px}
.session-rate.r-hi{color:var(--green)}.session-rate.r-mid{color:#d97706}.session-rate.r-low{color:var(--red)}
.session-rate.is-future{color:var(--text3);font-weight:700}
.sort-sel{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;outline:none}
/* 4-state attendance buttons */
.att-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);font-size:15px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center}
.att-btn.present{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.att-btn.absent{background:rgba(217,119,6,.12);border-color:#d97706;color:#d97706;font-size:13px;font-weight:700}
.att-btn.unauth{background:rgba(225,29,72,.14);border-color:#e11d48;color:#e11d48;font-size:9px;font-weight:900;letter-spacing:-.5px}
.att-btn.none{background:var(--bg);border-color:var(--border);color:var(--text3)}
.att-btn:hover{transform:scale(1.08)}
[data-theme="dark"] .att-btn.absent{background:rgba(251,191,36,.15);border-color:#fbbf24;color:#fbbf24}
[data-theme="dark"] .att-btn.unauth{background:rgba(251,113,133,.18);border-color:#fb7185;color:#fb7185}
.att-btn.note{background:rgba(107,114,128,.12);border-color:#4b5563;color:#4b5563;font-size:16px;font-weight:800}
[data-theme="dark"] .att-btn.note{background:rgba(156,163,175,.15);border-color:#9ca3af;color:#9ca3af}
.att-btn.trial{background:rgba(139,92,246,.12);border-color:#7c3aed;color:#7c3aed;font-size:10px;font-weight:800}
[data-theme="dark"] .att-btn.trial{background:rgba(167,139,250,.15);border-color:#a78bfa;color:#a78bfa}
.note-label{font-size:11px;color:#4b5563;margin-top:3px;font-weight:700;text-align:center;max-width:80px;line-height:1.3;word-break:keep-all}
[data-theme="dark"] .note-label{color:#9ca3af}
.trial-label{font-size:11px;color:#7c3aed;margin-top:3px;font-weight:700;text-align:center}
[data-theme="dark"] .trial-label{color:#a78bfa}
.trial-badge{background:rgba(139,92,246,.12);color:#7c3aed;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
[data-theme="dark"] .trial-badge{background:rgba(167,139,250,.15);color:#a78bfa}
.join-btn{padding:4px 12px;border-radius:8px;font-size:12px;font-weight:700;border:1.5px solid var(--border);cursor:pointer;transition:.2s}
.join-btn.joined{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.join-btn.not-joined{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.att-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.reason-label{font-size:12px;color:#d97706;margin-top:3px;max-width:80px;font-weight:700;line-height:1.3;word-break:keep-all;text-align:center}
.unauth-label{font-size:11px;color:#e11d48;margin-top:3px;font-weight:800;text-align:center}
[data-theme="dark"] .reason-label{color:#fbbf24}
[data-theme="dark"] .unauth-label{color:#fb7185}
.warning-badge{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;color:#b45309;background:rgba(245,158,11,.18);padding:2px 8px;border-radius:10px;margin-left:6px}
[data-theme="dark"] .warning-badge{color:#fbbf24;background:rgba(251,191,36,.15)}
/* Hide reasons mode */
.hide-reasons .reason-label,.hide-reasons .unauth-label,.hide-reasons .note-label,.hide-reasons .trial-label,.hide-reasons .memo-line,.hide-reasons .injury-label,.hide-reasons .personal-label,.hide-reasons .rest-label{display:none!important}
.rate-badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.rate-high{background:var(--green-bg);color:var(--green)}.rate-mid{background:var(--yellow-bg);color:var(--yellow)}.rate-low{background:var(--red-bg);color:var(--red)}
.member-list{display:grid;gap:8px}
.member-card{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:var(--bg2);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);box-shadow:var(--shadow);transition:.2s}
.member-card:hover{box-shadow:var(--shadow2);border-color:var(--accent)}
.member-info{display:flex;align-items:center;gap:12px}
.member-avatar{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--accent-light);color:var(--accent)}
.member-name{font-weight:700;font-size:15px;color:var(--text)}.member-sub{font-size:12px;color:var(--text3)}
.member-actions{display:flex;gap:6px;flex-wrap:wrap}
.modal-overlay{position:fixed;inset:0;z-index:1000;background:var(--modal-bg);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:16px;padding:28px;width:460px;max-width:94vw;max-height:85vh;overflow-y:auto;border:1px solid var(--border);box-shadow:var(--shadow2)}
.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title h3{font-size:17px;font-weight:700;color:var(--text)}
.modal-close{background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;padding:2px 6px}.modal-close:hover{color:var(--text)}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:var(--text3);font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.field textarea{resize:vertical;min-height:60px}
.field select option{background:var(--bg2);color:var(--text)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.date-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.date-cell{padding:8px 2px;border-radius:8px;border:1.5px solid transparent;text-align:center;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;background:var(--bg);color:var(--text)}
.date-cell.dow{font-size:11px;color:var(--text3);font-weight:700;cursor:default;background:none}
.date-cell.empty{cursor:default;background:none}
.date-cell.selectable:hover{border-color:var(--accent);background:var(--accent-light)}
.date-cell.selected{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.date-cell.tuesday{color:var(--accent);font-weight:700}
.date-cell.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.date-cell.existing{background:var(--bg3);color:var(--text3);cursor:not-allowed;opacity:.5}
.venue-per-date{margin-top:12px;display:grid;gap:8px;max-height:200px;overflow-y:auto}
.venue-row{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:8px 10px;border:1px solid var(--border);font-size:13px;flex-wrap:wrap}
.venue-row .date-label{min-width:80px;font-weight:700;color:var(--accent)}
.venue-row select,.venue-row input{flex:1;padding:6px 8px;font-size:13px;min-width:100px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.reason-popup{position:fixed;z-index:2000;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;box-shadow:var(--shadow2);width:240px;display:none}
.reason-popup.open{display:block}
.reason-popup textarea{width:100%;min-height:50px;margin-bottom:8px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;outline:none;resize:vertical}
.reason-popup textarea:focus{border-color:var(--accent)}
/* ── 출석 상태 선택 팝업 ── */
.reason-popup{width:250px}
.pick-title{font-size:14px;font-weight:800;color:var(--green);text-align:center;margin-bottom:2px}
.pick-sub{font-size:11px;color:var(--text3);text-align:center;margin-bottom:10px}
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto}
.pick-opt{width:100%;padding:9px 12px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:.15s}
.pick-opt:hover{transform:translateY(-1px);border-color:var(--accent)}
.pick-opt.sel{border-color:var(--accent);background:var(--accent-bg,rgba(37,99,235,.1));color:var(--accent)}
.pick-opt.c-present{color:var(--green);border-color:rgba(22,163,74,.45)}
.pick-opt.c-absent{color:#d97706;border-color:rgba(217,119,6,.45)}
.pick-opt.c-unauth{color:#e11d48;border-color:rgba(225,29,72,.45)}
.pick-opt.c-trial{color:#7c3aed;border-color:rgba(139,92,246,.45)}
.pick-opt.c-gray{color:var(--text3)}
.pick-close{width:100%;margin-top:8px;padding:8px;border-radius:9px;border:none;background:var(--bg3);color:var(--text2);font-size:13px;font-weight:700;cursor:pointer}
.memo-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.memo-chip{padding:4px 9px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer}
.memo-chip:hover{border-color:var(--accent);color:var(--accent)}
.att-btn.injury{background:rgba(219,39,119,.12);border-color:#db2777;color:#db2777;font-size:10px;font-weight:800}
.att-btn.personal{background:rgba(2,132,199,.12);border-color:#0284c7;color:#0284c7;font-size:10px;font-weight:800}
.att-btn.sameday{background:rgba(217,119,6,.12);border-color:#d97706;color:#d97706;font-size:9px;font-weight:900;letter-spacing:-.5px}
.att-btn.rest{background:var(--bg3);border-color:var(--border);color:var(--text3);font-size:10px;font-weight:800}
.injury-label{font-size:11px;color:#db2777;margin-top:3px;font-weight:700;text-align:center;max-width:80px;line-height:1.3;word-break:keep-all}
.personal-label{font-size:11px;color:#0284c7;margin-top:3px;font-weight:700;text-align:center;max-width:80px;line-height:1.3;word-break:keep-all}
.rest-label{font-size:11px;color:var(--text3);margin-top:3px;font-weight:700;text-align:center}
.memo-line{font-size:10px;color:var(--text3);margin-top:2px;text-align:center;max-width:82px;line-height:1.25;word-break:keep-all}
.att-pre{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;color:var(--border);font-size:14px;font-weight:700}
.empty-state{text-align:center;padding:50px 20px;color:var(--text3)}.empty-state .icon{font-size:40px;margin-bottom:10px}.empty-state p{margin-bottom:14px}
.rest-detail{background:var(--bg);border-radius:8px;padding:8px 12px;margin-top:4px;font-size:12px;color:var(--text2)}
.rest-badge{background:var(--orange-bg);color:var(--orange);padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
.status-badge{padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600}
.status-resting{background:var(--orange-bg);color:var(--orange)}
.status-returning{background:var(--green-bg);color:var(--green)}
.status-pending{background:var(--yellow-bg);color:var(--yellow)}
.dues-btn{padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700;border:1.5px solid var(--border);cursor:pointer;transition:.2s}
.dues-btn.paid{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.dues-btn.unpaid{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.dues-btn.d-paid{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.dues-btn.d-trial{background:rgba(139,92,246,.12);border-color:#7c3aed;color:#7c3aed}
.dues-btn.d-unpaid{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.dues-btn.d-carry{background:rgba(217,119,6,.12);border-color:#d97706;color:#d97706}
.dues-btn.d-rest{background:var(--bg3);border-color:var(--border);color:var(--text3)}
.dues-btn.d-none{background:var(--bg);border-color:var(--border);color:var(--text3)}
.pick-opt.d-paid{color:var(--green);border-color:rgba(22,163,74,.45)}
.pick-opt.d-trial{color:#7c3aed;border-color:rgba(139,92,246,.45)}
.pick-opt.d-unpaid{color:var(--red);border-color:rgba(225,29,72,.45)}
.pick-opt.d-carry{color:#d97706;border-color:rgba(217,119,6,.45)}
.pick-opt.d-rest{color:var(--text3)}
.hide-dues-memo .dues-memo{display:none!important}
/* ── 회원 스탯 ── */
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.stat-box .box-h{font-size:14px;font-weight:800;color:var(--text);margin-bottom:12px}
.fut-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.fut-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s}
.fut-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12);border-color:var(--accent)}
.fut-card.is-empty{opacity:.62}
.fut-top{display:flex;align-items:baseline;gap:8px;padding:12px 14px 8px;background:linear-gradient(135deg,var(--bg3),transparent)}
.fut-ovr{font-size:30px;font-weight:900;line-height:1;letter-spacing:-1px}
.ovr-delta{font-size:11px;font-weight:800;margin-left:3px;vertical-align:super}
.fut-pos{font-size:11px;font-weight:800;color:var(--text3);margin-left:auto;background:var(--bg);padding:3px 8px;border-radius:10px}
.fut-body{padding:0 14px 12px}
.fut-name{font-size:14px;font-weight:800;color:var(--text);margin-bottom:2px}
.fut-name .rest-badge,.fut-name .trial-badge,.fut-name .inj-badge{margin-left:3px}
.fut-sub{font-size:10px;color:var(--text3);margin-bottom:9px}
.fut-bars{display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:8px}
.fb{display:flex;flex-direction:column;align-items:center;gap:2px}

<body>
<div class="loading-screen" id="loadingScreen"><div class="loading-spinner"></div><div style="font-size:16px;font-weight:700;color:var(--text)">WAVE FC</div><div style="font-size:12px;color:var(--text3);margin-top:4px">데이터를 불러오는 중...</div></div>
<header><div class="container header-inner">
  <div class="logo"><div class="logo-icon">W</div><div class="logo-text"><h1>WAVE FC 출석 및 회원 관리</h1><p>매주 화요일 정기 운동</p></div></div>
  <div class="header-actions"><div class="conn-status conn-offline" id="connStatus"><span class="conn-dot"></span><span id="connText">연결 중...</span></div><button class="theme-toggle" onclick="toggleTheme()" title="다크모드 전환">🌙</button></div>
</div></header>
<div class="container" style="padding-top:8px;padding-bottom:40px">

  <div id="tab-trial" class="tab-content fade-in" style="display:none"></div>
  <div id="tab-all" class="tab-content fade-in" style="display:none"></div>
  <div id="tab-dues" class="tab-content fade-in" style="display:none"></div>

</div>
<div class="modal-overlay" id="memberModal"><div class="modal" onclick="event.stopPropagation()"><div class="modal-title"><h3 id="memberModalTitle">회원 추가</h3><button class="modal-close" onclick="closeModal('memberModal')">✕</button></div><div id="memberForm"></div></div></div>

<div class="modal-overlay" id="restModal"><div class="modal" onclick="event.stopPropagation()"><div class="modal-title"><h3 id="restModalTitle">휴식 처리</h3><button class="modal-close" onclick="closeModal('restModal')">✕</button></div><div id="restForm"></div></div></div>
<div class="modal-overlay" id="retireModal"><div class="modal" onclick="event.stopPropagation()"><div class="modal-title"><h3>탈퇴 처리</h3><button class="modal-close" onclick="closeModal('retireModal')">✕</button></div><div id="retireForm"></div></div></div>

    <div class="pick-title" id="pickTitle">이름</div>

  </div>

    <label style="font-size:12px;font-weight:600;color:var(--text3);margin-bottom:4px;display:block" id="memoLabel">메모</label>

    <textarea id="reasonText" placeholder="사유를 입력하세요"></textarea>

      <button class="btn btn-sm btn-secondary" onclick="backToPicker()">← 상태</button>
      <div style="display:flex;gap:6px"><button class="btn btn-sm btn-secondary" onclick="cancelReason()">건너뛰기</button><button class="btn btn-sm btn-primary" onclick="saveReason()">저장</button></div>
    </div>
  </div>
</div>
<script>
// ═══ FIREBASE CONFIG ═══
const firebaseConfig = {
  apiKey: "AIzaSyDUj9HrX_G5ooaBqLSL_9gES8xYu8Bv-CI",
  authDomain: "wave-b0878.firebaseapp.com",
  databaseURL: "https://wave-b0878-default-rtdb.firebaseio.com",
  projectId: "wave-b0878",
  storageBucket: "wave-b0878.firebasestorage.app",
  messagingSenderId: "871858545436",
  appId: "1:871858545436:web:99f1676417170ab8b6d0d9"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database(),dataRef=db.ref('wavefc');

// ═══ CONSTANTS ═══
const VENUES=["내서스포츠","BJ풋살장","원계풋살장","해양풋살장","직접입력"];
const ROUTES=["블로그","인스타","당근","직접입력"];
const DOW=["일","월","화","수","목","금","토"];
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtDate=ds=>{const d=new Date(ds.replace(/\./g,'-'));return`${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`};
const korSort=(a,b)=>a.name.localeCompare(b.name,'ko');
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const todayDot=()=>{const d=new Date();return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')};

// ═══ STATE ═══
let S={members:[],resting:[],retired:[],trial:[],notjoined:[],sessions:[],attendance:{},reasons:{},dues:{},pstats:{},statLog:{},injuries:{},lineup:{}};
let viewYear=new Date().getFullYear(),viewMonth=new Date().getMonth(),currentTab='attendance';
let editingMemberId=null,editingSessionId=null,reasonTarget=null;
let selectedDates=[],venuePerDate={},customVenue={},calYear,calMonth;
let restTargetId=null,retireTargetId=null,saving=false;
let hideReasons=false;
let attSort='name';
// 출석표 정렬: 이름 / 가입일 / 등번호 / 출석률
function attSortList(list,ms){
  const arr=[...list];
  if(attSort==='join')      arr.sort((a,b)=>(dnum(a.joinDate)||99999999)-(dnum(b.joinDate)||99999999)||korSort(a,b));
  else if(attSort==='num')  arr.sort((a,b)=>{const x=parseInt(a.number,10),y=parseInt(b.number,10);
                                 const ax=isNaN(x)?99999:x, by=isNaN(y)?99999:y;
                                 return ax-by||korSort(a,b)});
  else if(attSort==='rate') arr.sort((a,b)=>memMonthRate(b.id,ms).r-memMonthRate(a.id,ms).r||korSort(a,b));
  else                      arr.sort(korSort);
  return arr;
}
let showAllMembers=false;

// ═══ FIREBASE ═══
function saveData(){if(saving)return;saving=true;dataRef.set(S).then(()=>{saving=false}).catch(e=>{console.error(e);saving=false})}
dataRef.on('value',snap=>{
  const d=snap.val();
  if(d){S.members=d.members||[];S.resting=d.resting||[];S.retired=d.retired||[];S.trial=d.trial||[];S.notjoined=d.notjoined||[];S.sessions=d.sessions||[];S.attendance=d.attendance||{};S.reasons=d.reasons||{};S.dues=d.dues||{};S.pstats=d.pstats||{};S.statLog=d.statLog||{};S.injuries=d.injuries||{};S.lineup=d.lineup||{}}
  render();
  const ls=document.getElementById('loadingScreen');if(ls)ls.classList.add('hidden');
});
const connRef=db.ref('.info/connected');
connRef.on('value',snap=>{const el=document.getElementById('connStatus'),txt=document.getElementById('connText');if(snap.val()===true){el.className='conn-status conn-online';txt.textContent='실시간 연결됨'}else{el.className='conn-status conn-offline';txt.textContent='연결 끊김'}});

// ═══ THEME ═══
function toggleTheme(){const dk=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',dk?'':'dark');document.querySelector('.theme-toggle').textContent=dk?'🌙':'☀️';try{localStorage.setItem('wavefc_theme',dk?'light':'dark')}catch(e){}}
(function(){try{if(localStorage.getItem('wavefc_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');document.querySelector('.theme-toggle').textContent='☀️'}}catch(e){}})();

// ═══ TABS ═══
const TABS=[{key:'attendance',label:'📋 출석체크'},{key:'active',label:'⚽ 활동회원'},{key:'resting',label:'😴 휴식회원'},{key:'retired',label:'📁 탈퇴회원'},{key:'trial',label:'🌟 체험회원'},{key:'all',label:'👥 회원관리'},{key:'dues',label:'💰 회비관리'},{key:'stats',label:'📈 회원 스탯'}];
function renderTabs(){document.getElementById('tabBar').innerHTML=TABS.map(t=>`<button class="tab-btn ${currentTab===t.key?'active':''}" onclick="switchTab('${t.key}')">${t.label}</button>`).join('')}
function switchTab(t){if(t!=='stats')statView=null;currentTab=t;TABS.forEach(x=>{const el=document.getElementById('tab-'+x.key);if(el)el.style.display=x.key===t?'':'none'});renderTabs();render()}
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.modal-overlay').forEach(el=>{el.addEventListener('click',()=>el.classList.remove('open'))});

// ═══ HELPERS ═══
function getMS(){return(S.sessions||[]).filter(s=>{const d=new Date(s.date);return d.getFullYear()===viewYear&&d.getMonth()===viewMonth}).sort((a,b)=>a.date.localeCompare(b.date))}
function sessStats(sid){let p=0;(S.members||[]).forEach(m=>{const v=S.attendance&&S.attendance[m.id+'_'+sid];if(v===true||v==='trial_att')p++});return{present:p,total:(S.members||[]).length}}
// ═══ ATTENDANCE (상태 선택식) ═══
// 미니홈피 출석탭과 동일한 상태 구성. count:true 인 상태만 출석률에 반영.
const ATT_STATES=[
  {v:true,        label:'○ 출석',        cls:'present', icon:'✓',    sub:'',       c:'c-present', count:true},
  {v:'absent',    label:'× 결석',        cls:'absent',  icon:'✗',    sub:'',       c:'c-absent'},
  {v:'sameday',   label:'× (당일) 당일 결석', cls:'sameday', icon:'✗당일', sub:'당일결석', c:'c-absent'},
  {v:'unauth',    label:'무단',          cls:'unauth',  icon:'무단', sub:'무단결석', c:'c-unauth'},
  {v:'trial_att', label:'체험',          cls:'trial',   icon:'체험', sub:'체험',    c:'c-trial', count:true},
  {v:'rest',      label:'휴식중',        cls:'rest',    icon:'휴식', sub:'휴식중',  c:'c-gray'},
  {v:'injury',    label:'부상',          cls:'injury',  icon:'부상', sub:'부상',    c:'c-absent'},
  {v:'personal',  label:'개인사정',      cls:'personal',icon:'개인', sub:'개인사정',c:'c-absent'},
  {v:'note',      label:'비고',          cls:'note',    icon:'—',    sub:'',       c:'c-gray'}
];
function attState(v){return ATT_STATES.find(s=>s.v===v)||null}
function attCounts(v){const s=ATT_STATES.find(x=>x.v===v);return!!(s&&s.count)}
// "2026.04.08" "2026. 07. 14" "2026-8-11" 등 → 20260408 형태 숫자
function dnum(d){
  const p=String(d||'').match(/\d+/g);
  if(!p||p.length<3)return 0;
  return parseInt(p[0],10)*10000+parseInt(p[1],10)*100+parseInt(p[2],10);
}
// 가입일 이전 일정은 애초에 참석할 수 없으므로 출석률 분모에서 제외
function eligSessions(m,ms){
  const j=dnum(m&&m.joinDate);
  if(!j)return ms;
  return ms.filter(s=>dnum(s.date)>=j);
}
function memMonthRate(mid,ms){
  const all=[...(S.members||[]),...(S.resting||[]),...(S.retired||[]),...(S.trial||[])];
  const m=all.find(x=>x.id===mid);
  // 가입 전 일정 + 아직 열리지 않은 일정은 분모에서 제외
  const el=eligSessions(m,(ms||[]).filter(s=>dnum(s.date)<=todayNum()));
  if(!el.length)return{a:0,t:0,r:0};
  let a=0;el.forEach(s=>{if(attCounts(S.attendance&&S.attendance[mid+'_'+s.id]))a++});
  return{a,t:el.length,r:Math.round(a/el.length*100)};
}
function todayNum(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
// 아직 오지 않은 일정은 팀 출석률에서 제외 (미참으로 잡히는 것 방지)
function teamRate(ms){
  const mem=S.members||[];
  const past=(ms||[]).filter(s=>dnum(s.date)<=todayNum());
  if(!past.length||!mem.length)return 0;
  let t=0,tot=0;
  mem.forEach(m=>{const el=eligSessions(m,past);tot+=el.length;el.forEach(s=>{if(attCounts(S.attendance&&S.attendance[m.id+'_'+s.id]))t++})});
  return tot?Math.round(t/tot*100):0;
}
// 그날 하루의 출석률(%) — 가입 전 회원은 분모에서 제외
function sessRate(sid){
  const s=(S.sessions||[]).find(x=>x.id===sid);if(!s)return null;
  const mem=(S.members||[]).filter(m=>{const j=dnum(m.joinDate);return!j||dnum(s.date)>=j});
  if(!mem.length)return null;
  let p=0;mem.forEach(m=>{if(attCounts(S.attendance&&S.attendance[m.id+'_'+sid]))p++});
  return Math.round(p/mem.length*100);
}
function rb(rate,txt){const c=rate>=70?'rate-high':rate>=40?'rate-mid':'rate-low';return`<span class="rate-badge ${c}">${txt}</span>`}
function hasWarning(mid,ms){
  if(!ms.length)return false;
  let unauthCount=0,curConsec=0,maxConsec=0;
  ms.forEach(s=>{
    const v=S.attendance&&S.attendance[mid+'_'+s.id];
    if(v==='unauth'){unauthCount++;curConsec++;if(curConsec>maxConsec)maxConsec=curConsec}else{curConsec=0}
  });
  return unauthCount>=2||maxConsec>=2;
}

// 출석표에 표시할 회원 목록 (renderAtt / exportAtt 공용)
function currentAttList(){
  const ms=getMS();
  // Build member list: active + trial always, resting/retired if they have data or showAll
  let allList=[...(S.members||[])];
  (S.trial||[]).forEach(m=>{allList.push({...m,_status:'체험'})});
  const restList=(S.resting||[]).map(m=>({...m,_status:'휴식'}));
  const retList=(S.retired||[]).map(m=>({...m,_status:'탈퇴'}));
  if(showAllMembers){
    allList=allList.concat(restList,retList);
  } else {
    // Include resting/retired members who have any attendance in this month
    [...restList,...retList].forEach(m=>{
      const hasData=ms.some(s=>{const v=(S.attendance||{})[m.id+'_'+s.id];return v!==undefined&&v!==null});
      if(hasData)allList.push(m);
    });
  }
  // Filter: show members who were active during the viewed month
  const viewStart=new Date(viewYear,viewMonth,1);
  const viewEnd=new Date(viewYear,viewMonth+1,0);
  function pd(s){if(!s)return null;const d=new Date(s.replace(/\./g,'-'));return isNaN(d)?null:d}
  allList=allList.filter(m=>{
    const jd=pd(m.joinDate);
    if(jd && jd>viewEnd) return false; // joined after this month
    // For retired members, check retiredDate
    if(m._status==='탈퇴'){const rd=pd(m.retiredDate);if(rd && rd<viewStart) return false}
    // For resting members, check restStartDate
    if(m._status==='휴식'){const rd=pd(m.restStartDate||m.restDate);if(rd && rd<viewStart) return false}
    return true;
  });
  return allList;
}

function cycleAtt(mid,sid,evt){ openAttPicker(mid,sid,evt); }
function openAttPicker(mid,sid,evt){
  const all=[...(S.members||[]),...(S.resting||[]),...(S.retired||[]),...(S.trial||[])];
  const m=all.find(x=>x.id===mid), s=(S.sessions||[]).find(x=>x.id===sid);
  reasonTarget={m:mid,s:sid,type:'pick'};
  document.getElementById('pickTitle').textContent=m?m.name:'';
  document.getElementById('pickSub').textContent=(s?esc(s.date):'')+' 출석 상태 선택';
  const cur=(S.attendance||{})[mid+'_'+sid];
  let h='';
  ATT_STATES.forEach(st=>{
    const sel=(cur===st.v)?' sel':'';
    h+=`<button class="pick-opt ${st.c}${sel}" onclick="pickAtt('${String(st.v)}')">${esc(st.label)}${sel?' ✓':''}</button>`;
  });
  h+=`<button class="pick-opt c-gray" onclick="pickAtt('__clear')">지우기</button>`;
  document.getElementById('pickList').innerHTML=h;
  showPane('pick');
  const popup=document.getElementById('reasonPopup');
  const r=evt.target.getBoundingClientRect();
  popup.style.top=Math.max(8,Math.min(r.bottom+8,window.innerHeight-470))+'px';
  popup.style.left=Math.min(Math.max(8,r.left-100),window.innerWidth-262)+'px';
  popup.classList.add('open');
}
function showPane(which){
  document.getElementById('attPickPane').style.display=which==='pick'?'':'none';
  document.getElementById('attMemoPane').style.display=which==='memo'?'':'none';
}
function pickAtt(raw){
  if(!reasonTarget)return;
  const mid=reasonTarget.m,sid=reasonTarget.s,key=mid+'_'+sid;
  if(!S.attendance)S.attendance={};if(!S.reasons)S.reasons={};
  if(raw==='__clear'){
    delete S.attendance[key];delete S.reasons[key];
    saveData();render();cancelReason();return;
  }
  const val=(raw==='true')?true:raw;
  S.attendance[key]=val;
  saveData();render();
  // 상태를 고른 뒤 메모 단계로 이동
  reasonTarget={m:mid,s:sid,type:'memo',val:val};
  const st=attState(val);
  document.getElementById('memoLabel').textContent=(st?st.label.replace(/^[○×]\s*/,'').replace(/^\(당일\)\s*/,''):'')+' 메모 (선택)';
  const chips=MEMO_CHIPS[String(val)]||[];
  document.getElementById('memoChips').innerHTML=chips.map(c=>`<span class="memo-chip" onclick="addChip('${esc(c)}')">${esc(c)}</span>`).join('');
  const ta=document.getElementById('reasonText');
  ta.value=(S.reasons&&S.reasons[key])||'';
  ta.placeholder=(val===true)?'예: 당일 출석으로 전환':'사유를 입력하세요';
  showPane('memo');
  setTimeout(()=>ta.focus(),50);
}
function addChip(t){const ta=document.getElementById('reasonText');ta.value=t;ta.focus()}
function backToPicker(){
  if(!reasonTarget)return;
  const evt={target:{getBoundingClientRect:()=>document.getElementById('reasonPopup').getBoundingClientRect()}};
  const mid=reasonTarget.m,sid=reasonTarget.s;
  const popup=document.getElementById('reasonPopup');const keep={top:popup.style.top,left:popup.style.left};
  openAttPicker(mid,sid,evt);
  popup.style.top=keep.top;popup.style.left=keep.left;
}
function saveReason(){if(!reasonTarget)return;if(!S.reasons)S.reasons={};const k=reasonTarget.m+'_'+reasonTarget.s,t=document.getElementById('reasonText').value.trim();if(t)S.reasons[k]=t;else delete S.reasons[k];document.getElementById('reasonPopup').classList.remove('open');reasonTarget=null;saveData();render()}
function cancelReason(){document.getElementById('reasonPopup').classList.remove('open');reasonTarget=null;showPane('pick')}
document.addEventListener('click',e=>{const p=document.getElementById('reasonPopup');if(p.classList.contains('open')&&!p.contains(e.target)&&!e.target.classList.contains('att-btn'))cancelReason()});

// ═══ 엑셀(CSV) 내보내기 ═══
// 한글 깨짐 방지를 위해 UTF-8 BOM 포함. 엑셀에서 바로 열립니다.
function csvEsc(v){return'"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
function downloadCSV(name,rows){
  const csv='\uFEFF'+rows.map(r=>r.map(csvEsc).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},200);
}
function xbtn(fn){return`<button class="btn btn-sm btn-secondary" onclick="${fn}">📊 엑셀 내보내기</button>`}
function ymStamp(){return viewYear+'-'+String(viewMonth+1).padStart(2,'0')}
function attLabelOf(mid,sid){
  const v=(S.attendance||{})[mid+'_'+sid];
  if(v===undefined||v===null)return'';
  const st=(v===false)?attState('absent'):attState(v);
  return st?st.label.replace(/^[○×]\s*/,''):'';
}

function exportAtt(){
  const ms=getMS();
  const list=attSortList(currentAttList(),ms);
  const head=['번호','이름','구분','가입일','등번호'];
  ms.forEach(s=>{head.push(fmtDate(s.date)+' '+(s.venue||''));head.push('메모')});
  head.push('출석','대상','출석률(%)');
  const rows=[head];
  list.forEach((m,i)=>{
    const r=memMonthRate(m.id,ms),jn=dnum(m.joinDate);
    const row=[i+1,m.name,m._status||'활동',m.joinDate||'',m.number||''];
    ms.forEach(s=>{
      if(jn&&dnum(s.date)<jn){row.push('가입전','');return}
      row.push(attLabelOf(m.id,s.id),(S.reasons||{})[m.id+'_'+s.id]||'');
    });
    row.push(r.a,r.t,r.r);
    rows.push(row);
  });
  rows.push([]);
  rows.push(['일자별 출석률(%)','']);
  ms.forEach(s=>{const fut=dnum(s.date)>todayNum();rows.push([fmtDate(s.date),fut?'예정':(sessRate(s.id)===null?'-':sessRate(s.id))])});
  rows.push(['팀 출석률(오늘까지)',teamRate(ms)]);
  downloadCSV(`WAVE_출석표_${ymStamp()}.csv`,rows);
}

function logsOf(id){
  return [...((S.statLog||{})[id]||[])]
    .map(r=>{const o={...r};Object.keys(STAT_ALIAS).forEach(k=>{
      if(o[k]!==undefined&&o[STAT_ALIAS[k]]===undefined)o[STAT_ALIAS[k]]=o[k]});return o})

function injOf(id){return [...((S.injuries||{})[id]||[])].sort((a,b)=>dnum(b.start)-dnum(a.start))}
function activeInj(id){return injOf(id).filter(x=>!x.end)}

// 현재 능력치 = 가장 최근 기록
function curAbil(id){
  const lg=logsOf(id),last=lg.length?lg[lg.length-1]:null,out={};
  ABIL.forEach(k=>{out[k]=(last&&typeof last[k]==='number')?last[k]:0});
  return out;
}
function hasAbil(id){return logsOf(id).length>0}
function groupAvg(a,g){const v=g.keys.map(k=>a[k]||0);return Math.round(v.reduce((s,x)=>s+x,0)/v.length)}
// 기준 포지션 + 좌우 사이드로 OVR 계산 (포메이션·포지션 비교 공용)
// 아라 좌·우 적합도 — 주발만이 아니라 아웃사이드/인사이드 기술로 판단합니다.
// 같은 발 쪽(오른발-우측)은 인사이드로 안정적 전개, 반대 쪽(오른발-좌측)은
// 아웃사이드로 벌리거나 인사이드 슈팅으로 접어 들어가는 유형이 잘 맞습니다.
function sideFit(a,side,foot){
  const OUT=a['아웃사이드 터치']||0, IN=a['인사이드 터치']||0, INS=a['인사이드 슈팅']||0, CR=a['공중볼 패스']||0;
  let v;
  if(foot==='B') v=1.5+(Math.max(OUT,IN)-50)*0.06;
  else if(foot===side) v=(IN-50)*0.08+(CR-50)*0.03;        // 순발 측면 — 인사이드로 벌려주는 유형
  else v=1.5+(OUT-50)*0.10+(INS-50)*0.07;                  // 역발 측면 — 아웃사이드로 벌리거나 접어 들어가는 유형
  return Math.max(-7,Math.min(9,v));
}
function sideReason(a,side,foot){
  const OUT=a['아웃사이드 터치']||0,IN=a['인사이드 터치']||0,INS=a['인사이드 슈팅']||0;
  const sn=side==='L'?'왼쪽':'오른쪽';
  if(foot==='B')return `양발이라 ${sn} 어느 쪽이든 무난해요.`;
  if(foot===side)return IN>=65?`주발 쪽이고 인사이드 터치(${IN})가 좋아 ${sn}에서 벌려주는 전개가 안정적이에요.`
    :`주발 쪽이지만 인사이드 터치(${IN})가 낮아 ${sn}에서 단조로울 수 있어요.`;
  if(OUT>=65)return `역발 쪽이지만 아웃사이드 터치(${OUT})가 좋아 ${sn}에서 바깥으로 벌리는 플레이가 됩니다.`;
  if(INS>=65)return `역발 쪽이라 ${sn}에서 안으로 접어 인사이드 슛(${INS})으로 마무리하는 유형이에요.`;
  return `역발 쪽이라 각도는 나오지만, 아웃사이드 터치(${OUT})나 인사이드 슛(${INS})을 키우면 훨씬 좋아져요.`;
}

function ovrFor(a,base,side,foot){
  const d=POS_DEF[base];if(!d)return 0;
  const w=d.w;let sum=0,tot=0;
  Object.keys(w).forEach(k=>{sum+=(a[k]||0)*w[k];tot+=w[k]});
  let v=tot?sum/tot:0;
  if(side)v+=sideFit(a,side,foot);
  return Math.max(0,Math.min(99,Math.round(v)));
}
function posOVR(a,slotV,foot){
  const sl=SLOTS.find(s=>s.v===slotV);if(!sl)return 0;
  return ovrFor(a,sl.base,sl.foot,foot);
}

const FORMATIONS={
  '1-2-1':{label:'1-2-1',desc:'다이아몬드 · 균형형',slots:[
    {id:'PV',label:'피보',    base:'피보',    x:50,y:20},

function curForm(){const f=(S.lineup||{}).form;return FORMATIONS[f]?f:'1-2-1'}
function picks(){return ((S.lineup||{}).picks||{})}
function setForm(f){if(!S.lineup)S.lineup={};S.lineup={...S.lineup,form:f};saveData();render()}
function slotOVR(mid,sl){return ovrFor(curAbil(mid),sl.base,sl.side,pstat(mid).foot||'R')}
// 슬롯별 후보 (능력치 기록 있는 사람만)
// 팀 성향 — 자동 배치 기준이 달라집니다
const STYLES={
  attack :{label:'공격형',desc:'화력 우선',
    pick:(a,ovr)=>ovr*0.45+groupAvgKey(a,'SHO')*0.35+groupAvgKey(a,'DRI')*0.2},
  defense:{label:'수비형',desc:'안정 우선',
    pick:(a,ovr)=>ovr*0.45+groupAvgKey(a,'DEF')*0.35+groupAvgKey(a,'PHY')*0.2},
  balance:{label:'밸런스',desc:'종합 우선',
    pick:(a,ovr)=>ovr}
};
function groupAvgKey(a,key){const g=STAT_GROUPS.find(x=>x.key===key);return g?groupAvg(a,g):0}
function curStyle(){const s=(S.lineup||{}).style;return STYLES[s]?s:'balance'}
function setStyle(v){if(!S.lineup)S.lineup={};S.lineup={...S.lineup,style:v};saveData();render()}
function styleScore(mid,sl){
  const ovr=slotOVR(mid,sl);
  if(sl.base==='골레이로')return ovr; // 골문은 성향과 무관
  return STYLES[curStyle()].pick(curAbil(mid),ovr);
}
function candidates(sl){
  return statMembers().filter(m=>hasAbil(m.id))
    .map(m=>({m:m,ovr:slotOVR(m.id,sl),sc:styleScore(m.id,sl),inj:activeInj(m.id).length>0}))
    .sort((a,b)=>b.sc-a.sc);
}

function lineup(){
  const pk=picks(),fm=FORMATIONS[curForm()],out={},used={};
  const all=statMembers();
  fm.slots.forEach(sl=>{const mid=pk[sl.id];if(mid&&all.some(m=>m.id===mid)&&!used[mid]){out[sl.id]=mid;used[mid]=1}});
  const pairs=[];
  fm.slots.forEach(sl=>{if(out[sl.id])return;
    candidates(sl).forEach(c=>{if(!used[c.m.id])pairs.push({slot:sl.id,mid:c.m.id,sc:styleScore(c.m.id,sl)})})});
  pairs.sort((a,b)=>b.sc-a.sc);
  pairs.forEach(p=>{if(out[p.slot]===undefined&&!used[p.mid]){out[p.slot]=p.mid;used[p.mid]=1}});
  return out;
}

function teamReport(){
  const fm=FORMATIONS[curForm()],lu=lineup();
  const starters=fm.slots.map(sl=>({sl:sl,mid:lu[sl.id]})).filter(x=>x.mid);
  if(starters.length<fm.slots.length)return null;
  const field=starters.filter(x=>x.sl.base!=='골레이로');
  const avg={};
  STAT_GROUPS.forEach(g=>{avg[g.key]=Math.round(field.reduce((s,x)=>s+groupAvg(curAbil(x.mid),g),0)/field.length)});
  const gkSl=starters.find(x=>x.sl.base==='골레이로');
  const gkOvr=gkSl?slotOVR(gkSl.mid,gkSl.sl):0;
  const teamOvr=Math.round(starters.reduce((s,x)=>s+slotOVR(x.mid,x.sl),0)/starters.length);
  const order=STAT_GROUPS.filter(g=>g.key!=='GK').map(g=>g.key).sort((a,b)=>avg[b]-avg[a]);
  const nm=k=>(STAT_GROUPS.find(g=>g.key===k)||{}).label;
  const pros=[],cons=[];
  // 강점·약점
  pros.push(`${nm(order[0])}(${avg[order[0]]})·${nm(order[1])}(${avg[order[1]]})이 팀의 축이에요.`);
  const last=order[order.length-1];
  if(avg[last]<50)cons.push(`${nm(last)}이 ${avg[last]}로 가장 약해요.`);
  else cons.push(`상대적으로 ${nm(last)}(${avg[last]})이 아쉬워요.`);
  // 공수 균형
  const gap=avg.SHO-avg.DEF;
  if(gap>=12)pros.push('앞선에서 밀어붙이는 힘이 강합니다.'),cons.push('수비 전환이 늦으면 역습에 취약해요.');
  else if(gap<=-12)pros.push('실점을 억제하는 안정감이 있어요.'),cons.push('마무리를 지어줄 화력이 부족합니다.');
  else pros.push('공수 균형이 고르게 잡혀 있어요.');
  // 체력·기동력
  if(avg.PHY>=70)pros.push('활동량이 좋아 강한 압박을 오래 끌고 갈 수 있어요.');
  else if(avg.PHY<50)cons.push('체력·스피드가 낮아 후반 집중력 저하가 걱정돼요.');
  // 골문
  if(gkOvr>=75)pros.push(`골문(${gkOvr})이 든든해 뒷문 걱정은 적습니다.`);
  else if(gkOvr<50)cons.push(`골레이로(${gkOvr})가 약해 세트피스·중거리 실점 위험이 큽니다.`);
  // 좌우 균형
  const L=starters.find(x=>x.sl.side==='L'),R=starters.find(x=>x.sl.side==='R');
  if(L&&R){
    const dl=slotOVR(L.mid,L.sl),dr=slotOVR(R.mid,R.sl);
    if(Math.abs(dl-dr)>=12)cons.push(`좌우 편차가 커요(${dl} vs ${dr}). 약한 쪽으로 공격이 몰릴 수 있어요.`);
  }
  // 주발 구성
  const feet=field.map(x=>pstat(x.mid).foot||'R');
  if(feet.every(f=>f==='R'))cons.push('전원 오른발이라 왼쪽 측면 전개가 단조로워질 수 있어요.');
  else if(feet.filter(f=>f==='L'||f==='B').length>=2)pros.push('왼발 자원이 있어 양쪽 전개가 가능해요.');
  // 의사소통 — 픽소가 사령탑 역할
  const fxSl=starters.find(x=>x.sl.base==='픽소');
  if(fxSl){
    const fxA=curAbil(fxSl.mid),fxCom=groupAvgKey(fxA,'COM');
    const fxNm=(statMembers().find(m=>m.id===fxSl.mid)||{}).name||'';
    if(fxCom>=70)pros.push(`픽소 ${fxNm}의 지휘력(${fxCom})이 좋아 뒤에서 대형이 잡힙니다.`);
    else if(fxCom<50)cons.push(`픽소 ${fxNm}의 의사소통(${fxCom})이 낮아 수비 대형이 흔들릴 수 있어요.`);
  }
  if(gkSl){
    const gkCom=groupAvgKey(curAbil(gkSl.mid),'COM');
    if(gkCom<45)cons.push(`골레이로의 콜(${gkCom})이 약해 세트피스 상황에서 마크가 새기 쉬워요.`);
  }
  if(avg.COM>=68)pros.push('서로 부르고 맞춰주는 팀이라 수적 열세에서도 잘 버팁니다.');
  else if(avg.COM<48)cons.push('전체적으로 콜이 적어 순간 대형 변화에 대응이 늦을 수 있어요.');
  // 부상
  const inj=starters.filter(x=>activeInj(x.mid).length);
  if(inj.length)cons.push(`부상 중인 선수 ${inj.length}명이 선발에 포함돼 있어요.`);
  // 한 줄 총평
  const st=curStyle();
  let verdict;
  if(gap>=12)verdict=`${teamOvr}점짜리 공격 지향 스쿼드. 선제골로 흐름을 잡는 경기에 어울려요.`;
  else if(gap<=-12)verdict=`${teamOvr}점짜리 수비 지향 스쿼드. 버티다 역습으로 끝내는 그림이 좋아요.`;
  else verdict=`${teamOvr}점짜리 균형 스쿼드. 상대에 맞춰 어느 쪽으로도 갈 수 있어요.`;
  if(st==='attack'&&avg.DEF<52)verdict+=' 공격형으로 뽑은 만큼 뒷공간은 감수해야 합니다.';
  if(st==='defense'&&avg.SHO<52)verdict+=' 수비형 구성이라 득점 루트를 따로 준비해두세요.';
  return{avg,teamOvr,gkOvr,pros,cons,verdict,order};
}
function pickPlayer(slotId,mid){
  if(!S.lineup)S.lineup={};
  const pk={...picks()};
  if(pk[slotId]===mid)delete pk[slotId];
  else{Object.keys(pk).forEach(k=>{if(pk[k]===mid)delete pk[k]});pk[slotId]=mid}
  S.lineup={...S.lineup,picks:pk};saveData();render();
}

  let s=`<svg viewBox="0 0 380 340" style="width:100%;max-width:380px;height:auto;display:block;margin:0 auto 14px">`;

  const poly=vals.map((v,i)=>pt(i,R*Math.max(v,2)/99).map(x=>x.toFixed(1)).join(',')).join(' ');

// OVR 추이 선그래프
function trendSVG(lg,slot,foot){
  const pts=lg.map(r=>posOVR(r,slot,foot));
  if(pts.length<2)return'<div style="font-size:12px;color:var(--text3)">2회 이상 기록되면 그래프가 나타나요.</div>';
  const W=560,H=120,pad=28,lo=Math.max(0,Math.min(...pts)-8),hi=Math.min(99,Math.max(...pts)+8);
  const rng=Math.max(1,hi-lo),step=(W-pad*2)/(pts.length-1);
  const xy=pts.map((v,i)=>[pad+step*i,H-pad-((v-lo)/rng)*(H-pad*1.5)]);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:${W}px">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--border)"/>
    <polyline points="${xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  xy.forEach((p,i)=>{
    s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--accent)"/>
        <text x="${p[0].toFixed(1)}" y="${(p[1]-9).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="var(--text2)">${pts[i]}</text>
        <text x="${p[0].toFixed(1)}" y="${H-pad+14}" text-anchor="middle" font-size="9" fill="var(--text3)">${esc(lg[i].ym)}</text>`;
  });
  return s+'</svg>';
}

// 내보내기와 같은 형식. 쉼표 CSV, 엑셀에서 복사한 탭 구분 모두 지원.
const FOOT_IN={'오른발':'R','왼발':'L','양발':'B','R':'R','L':'L','B':'B'};
let importRows=null;
function splitLine(line,d){
  if(d==='\t')return line.split('\t');
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else { if(c==='"')q=true; else if(c===d){out.push(cur);cur=''} else cur+=c }
  }
  out.push(cur);return out;
}
function parseTable(text){
  const lines=String(text).replace(/^\uFEFF/,'').split(/\r?\n/);
  const hi=lines.findIndex(l=>l.indexOf('이름')>=0);
  if(hi<0)return null;
  const d=lines[hi].indexOf('\t')>=0?'\t':',';
  const head=splitLine(lines[hi],d).map(x=>x.trim().replace(/^"|"$/g,''));
  const rows=[];
  for(let i=hi+1;i<lines.length;i++){
    const raw=lines[i];
    if(!raw.trim())continue;
    if(raw.indexOf('──')>=0)break;           // 하단 이력 섹션에서 중단
    const c=splitLine(raw,d).map(x=>x.trim());
    if(!c[0])continue;
    rows.push(c);
  }
  return{head:head,rows:rows};
}

function previewImport(){
  const t=document.getElementById('impText').value;
  const p=parseTable(t);
  const box=document.getElementById('impPreview');
  if(!p||!p.rows.length){box.innerHTML='<div class="imp-warn">표를 읽지 못했어요. 첫 줄에 «이름»이 포함된 머리글이 있어야 합니다.</div>';importRows=null;return}
  const idx={};p.head.forEach((h,i)=>{if(h)idx[h]=i});
  const statCols=ABIL.filter(k=>idx[k]!==undefined);
  const all=statMembers();
  const ok=[],miss=[];
  p.rows.forEach(c=>{
    const nm=(c[idx['이름']]||'').trim();if(!nm)return;
    const m=all.find(x=>x.name===nm);
    if(!m){miss.push(nm);return}
    const vals={};let cnt=0;
    statCols.forEach(k=>{
      const v=(c[idx[k]]||'').trim();
      if(v===''||isNaN(parseInt(v,10)))return;
      vals[k]=Math.max(0,Math.min(99,parseInt(v,10)));cnt++;
    });
    const extra={};
    if(idx['주발']!==undefined&&FOOT_IN[(c[idx['주발']]||'').trim()])extra.foot=FOOT_IN[c[idx['주발']].trim()];
    if(idx['배치']!==undefined){const v=(c[idx['배치']]||'').trim();if(v==='자동')extra.pos='';else if(SLOTS.some(s=>s.v===v))extra.pos=v}
    if(idx['컨디션']!==undefined){const v=(c[idx['컨디션']]||'').trim();const cd=CONDS.find(x=>x.label===v);if(cd)extra.cond=cd.v}
    if(idx['관찰 메모']!==undefined){const v=(c[idx['관찰 메모']]||'').trim();if(v)extra.note=v}
    if(cnt||Object.keys(extra).length)ok.push({m:m,vals:vals,cnt:cnt,extra:extra});
  });
  importRows=ok;
  let h=`<div class="imp-box"><div class="imp-h">읽은 결과</div>
    <div class="imp-li">✅ 반영 대상 <b>${ok.length}명</b> · 스탯 항목 <b>${statCols.length}개</b></div>`;
  if(miss.length)h+=`<div class="imp-li warn">⚠️ 명단에 없는 이름 ${miss.length}명 — ${esc(miss.slice(0,8).join(', '))}${miss.length>8?' 외':''}</div>`;
  if(!statCols.length)h+='<div class="imp-li warn">⚠️ 스탯 열을 못 찾았어요. 머리글 이름이 내보내기와 같아야 합니다.</div>';
  h+='<div class="imp-list">'+ok.slice(0,12).map(o=>`<span class="imp-chip">${esc(o.m.name)} <b>${o.cnt}</b></span>`).join('')+(ok.length>12?`<span class="imp-chip">외 ${ok.length-12}명</span>`:'')+'</div>';
  h+=`</div><div style="text-align:right;margin-top:10px"><button class="btn btn-primary" onclick="applyImport()">이대로 반영</button></div>`;
  box.innerHTML=h;
}
function applyImport(){
  if(!importRows||!importRows.length)return alert('반영할 내용이 없어요.');
  const ym=document.getElementById('impYm').value.trim()||ymStamp();

function monthEndNum(){const last=new Date(viewYear,viewMonth+1,0).getDate();return viewYear*10000+(viewMonth+1)*100+last}
function joinedByMonth(m){const j=dnum(m&&m.joinDate);return!j||j<=monthEndNum()}
function duesMemberList(){
  return [...(S.members||[]).map(m=>({...m,_grp:'활동'})),

function openDuesPicker(mid,ym){
  duesTargetKey={m:mid,ym:ym};
  const all=[...(S.members||[]),...(S.resting||[]),...(S.trial||[])];
  const m=all.find(x=>x.id===mid);
  const cur=duesGet(mid,ym);
  const yp=ym.split('-');
  document.getElementById('duesModalTitle').textContent=(m?m.name:'')+' · '+yp[0]+'년 '+parseInt(yp[1],10)+'월 회비';
  let h='<div class="pick-list" style="max-height:none">';
  DUES_STATES.forEach(st=>{
    const sel=(cur&&cur.st===st.v)?' sel':'';
    h+=`<button class="pick-opt ${st.cls}${sel}" onclick="pickDues('${st.v}')">${st.label}${sel?' ✓':''}</button>`;
  });
  h+=`<button class="pick-opt c-gray" onclick="pickDues('__clear')">체크 해제</button></div>
  <div id="duesExtra" style="display:none;margin-top:12px">

    <input id="duesExtraInput" style="width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px">
    <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:12px">
      <button class="btn btn-sm btn-secondary" onclick="closeModal('duesModal')">건너뛰기</button>
      <button class="btn btn-sm btn-primary" onclick="saveDuesExtra()">저장</button>
    </div>
  </div>`;
  document.getElementById('duesForm').innerHTML=h;
  openModal('duesModal');
}
function pickDues(v){
  if(!duesTargetKey)return;
  const {m:mid,ym}=duesTargetKey;
  if(v==='__clear'){duesSet(mid,ym,null);saveData();render();closeModal('duesModal');return}
  const st=duesState(v);
  const prev=duesGet(mid,ym)||{};
  duesSet(mid,ym,{st:v,amt:(st.amt?(prev.amt||''):''),memo:(st.memo?(prev.memo||''):'')});
  saveData();render();
  if(st.amt||st.memo){
    document.getElementById('duesExtraLabel').textContent=st.amt?'체험 회비 금액':st.label+' 사유';
    const inp=document.getElementById('duesExtraInput');
    inp.placeholder=st.amt?'예: 10000':'예: 다음 달 합산 납부';
    inp.value=st.amt?(prev.amt||''):(prev.memo||'');
    document.getElementById('duesExtra').style.display='';
    setTimeout(()=>inp.focus(),50);
  } else {closeModal('duesModal')}
}
function saveDuesExtra(){
  if(!duesTargetKey)return;
  const {m:mid,ym}=duesTargetKey;
  const cur=duesGet(mid,ym);if(!cur){closeModal('duesModal');return}
  const st=duesState(cur.st),val=document.getElementById('duesExtraInput').value.trim();
  if(st&&st.amt)cur.amt=val;else if(st&&st.memo)cur.memo=val;
  duesSet(mid,ym,cur);saveData();closeModal('duesModal');render();
}

}
function deleteTrial(id){const m=(S.trial||[]).find(x=>x.id===id);if(!m||!confirm(m.name+' 체험회원을 삭제하시겠습니까?'))return;S.trial=S.trial.filter(x=>x.id!==id);saveData();render()}

// ═══ 미가입 처리 (체험 → 미가입 멤버) ═══
function openNotJoin(id){
  const m=(S.trial||[]).find(x=>x.id===id);if(!m)return;
  document.getElementById('memberModalTitle').textContent=esc(m.name)+' 미가입 처리';
  document.getElementById('memberForm').innerHTML=`
    <p style="margin-bottom:16px;color:var(--text2)"><strong>${esc(m.name)}</strong> 체험회원을 <strong>미가입 멤버</strong>로 옮깁니다.<br>
    <span style="font-size:12px;color:var(--text3)">탈퇴회원 탭 아래쪽에서 따로 관리돼요. 나중에 체험으로 되돌릴 수 있어요.</span></p>
    <div class="field"><label>미가입 확정일</label><input id="njDate" value="${todayDot()}" placeholder="예: 2026.08.18"></div>
    <div class="field"><label>미가입 사유</label><input id="njReason" placeholder="예: 거리가 멀어서 / 시간 안 맞음"></div>
    <div class="field"><label>메모 (선택)</label><input id="njMemo" value="${esc(m.memo||'')}" placeholder="참고할 내용"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button class="btn btn-secondary" onclick="closeModal('memberModal')">취소</button>
      <button class="btn btn-primary" onclick="confirmNotJoin('${m.id}')">미가입으로 이동</button>
    </div>`;
  openModal('memberModal');
}
function confirmNotJoin(id){
  const m=(S.trial||[]).find(x=>x.id===id);if(!m)return;
  S.trial=S.trial.filter(x=>x.id!==id);
  const{joinStatus,...base}=m;
  if(!S.notjoined)S.notjoined=[];
  S.notjoined.push({...base,
    notJoinDate:document.getElementById('njDate').value.trim()||todayDot(),
    notJoinReason:document.getElementById('njReason').value.trim(),
    memo:document.getElementById('njMemo').value.trim()});
  saveData();closeModal('memberModal');render();
}
function restoreNotJoined(id){
  const m=(S.notjoined||[]).find(x=>x.id===id);
  if(!m||!confirm(m.name+' 님을 체험회원으로 되돌리겠습니까?'))return;
  S.notjoined=S.notjoined.filter(x=>x.id!==id);
  const{notJoinDate,notJoinReason,...base}=m;
  if(!S.trial)S.trial=[];
  S.trial.push({...base,joinStatus:'not_joined'});
  saveData();render();
}
function deleteNotJoined(id){
  const m=(S.notjoined||[]).find(x=>x.id===id);
  if(!m||!confirm(m.name+' 님을 완전 삭제하시겠습니까?'))return;
  S.notjoined=S.notjoined.filter(x=>x.id!==id);
  saveData();render();
}

// ═══ DETAIL ═══
function openDetail(id){
  const m=(S.members||[]).find(x=>x.id===id);if(!m)return;
  const allS=[...(S.sessions||[])].sort((a,b)=>a.date.localeCompare(b.date));
  const att=allS.filter(s=>{const v=S.attendance&&S.attendance[m.id+'_'+s.id];return v===true||v==='trial_att'}).length,tot=allS.length;
  const rate=tot?Math.round(att/tot*100):0,crown=m.role==='exec'?'👑 ':'',rl=m.role==='exec'?'임원':'회원';
  const hist=m.restHistory||[];
  const histHtml=hist.length?`<div class="stat-card" style="margin-bottom:16px"><div class="stat-label">휴식 이력 (${hist.length}회)</div>${hist.map((r,i)=>'<div style="margin-top:6px;padding:6px 10px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--text2)">'+(i+1)+'. '+esc(r.startDate||'-')+' ~ '+esc(r.actualReturnDate||r.returnDate||'-')+'<br>사유: '+esc(r.reason||'-')+'</div>').join('')}</div>`:'';
  document.getElementById('detailContent').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px"><div class="stat-card"><div class="stat-label">이름</div><div style="font-weight:700;color:var(--text)">${crown}${esc(m.name)}</div></div><div class="stat-card"><div class="stat-label">구분</div><div style="font-weight:700;color:var(--text)">${rl}</div></div><div class="stat-card"><div class="stat-label">등번호</div><div style="font-weight:700;color:var(--text)">${esc(m.number)||'-'}</div></div><div class="stat-card"><div class="stat-label">전화번호</div><div style="font-weight:700;color:var(--text)">${esc(m.phone)||'-'}</div></div><div class="stat-card"><div class="stat-label">가입일</div><div style="font-weight:700;color:var(--text)">${esc(m.joinDate)||'-'}</div></div><div class="stat-card"><div class="stat-label">가입 경로</div><div style="font-weight:700;color:var(--text)">${esc(m.route)||'-'}</div></div></div><div style="background:var(--accent-light);border-radius:10px;padding:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;color:var(--text2)">전체 출석률</span><span style="font-size:20px;font-weight:800;color:var(--accent)">${rate}% (${att}/${tot})</span></div>${m.memo?'<div class="stat-card" style="margin-bottom:16px"><div class="stat-label">메모</div><div style="color:var(--text2)">'+esc(m.memo)+'</div></div>':''}${histHtml}<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-secondary" onclick="closeModal('detailModal');openEditMember('${m.id}')">수정</button><button class="btn btn-warning" onclick="closeModal('detailModal');openRestProcess('${m.id}')">휴식</button><button class="btn btn-danger" onclick="closeModal('detailModal');openRetireProcess('${m.id}')">탈퇴</button></div>`;
  openModal('detailModal');
}

// ═══ SESSION ═══
function openAddSessions(){editingSessionId=null;selectedDates=[];venuePerDate={};customVenue={};calYear=viewYear;calMonth=viewMonth;document.getElementById('sessionModalTitle').textContent='일정 추가 (여러 날짜 선택 가능)';renderSF();openModal('sessionModal')}
function openEditSession(id){editingSessionId=id;const s=(S.sessions||[]).find(x=>x.id===id);if(!s)return;const d=new Date(s.date);calYear=d.getFullYear();calMonth=d.getMonth();selectedDates=[s.date];venuePerDate={};customVenue={};venuePerDate[s.date]=s.venue;customVenue[s.date]=!!(s.venue&&!VENUES.slice(0,4).includes(s.venue));document.getElementById('sessionModalTitle').textContent='일정 수정';renderSF();openModal('sessionModal')}
function renderSF(){
  const existing=new Set((S.sessions||[]).map(s=>s.date));if(editingSessionId){const es=(S.sessions||[]).find(x=>x.id===editingSessionId);if(es)existing.delete(es.date)}
  const first=new Date(calYear,calMonth,1),lastDay=new Date(calYear,calMonth+1,0).getDate(),startDow=first.getDay(),todayStr=new Date().toISOString().slice(0,10);
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><button class="btn btn-ghost btn-sm" onclick="calPrev()">◀</button><span style="font-weight:700;font-size:15px;color:var(--text)">${calYear}년 ${calMonth+1}월</span><button class="btn btn-ghost btn-sm" onclick="calNext()">▶</button></div><div class="date-grid">${DOW.map(d=>'<div class="date-cell dow">'+d+'</div>').join('')}`;
  for(let i=0;i<startDow;i++)h+='<div class="date-cell empty"></div>';
  for(let d=1;d<=lastDay;d++){const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const isTue=new Date(calYear,calMonth,d).getDay()===2,isToday=ds===todayStr,isExist=existing.has(ds),isSel=selectedDates.includes(ds);let cls='date-cell';if(isExist)cls+=' existing';else cls+=' selectable';if(isSel)cls+=' selected';if(isTue&&!isSel)cls+=' tuesday';if(isToday)cls+=' today';h+=`<div class="${cls}" ${!isExist?`onclick="toggleDate('${ds}')"`:''}>${d}</div>`}
  h+='</div>';
  if(selectedDates.length){h+='<div class="venue-per-date">';[...selectedDates].sort().forEach(ds=>{
    const raw=Object.prototype.hasOwnProperty.call(venuePerDate,ds)?(venuePerDate[ds]||''):'내서스포츠';
    const isPreset=VENUES.slice(0,4).includes(raw);
    const isC=!!customVenue[ds]||(!!raw&&!isPreset);
    const sel=isC?'직접입력':(raw||'내서스포츠');
    h+=`<div class="venue-row"><span class="date-label">${fmtDate(ds)}</span>
      <select onchange="changeVenue('${ds}',this.value)">${VENUES.map(vn=>`<option value="${vn}" ${sel===vn?'selected':''}>${vn}</option>`).join('')}</select>
      ${isC?`<input value="${!isPreset?esc(raw):''}" placeholder="장소명 입력" oninput="setCV('${ds}',this.value)">`:''}</div>`;
  });h+='</div>'}
  h+=`<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap">`;
  if(editingSessionId)h+=`<button class="btn btn-danger" style="margin-right:auto" onclick="deleteSession()">삭제</button>`;
  h+=`<button class="btn btn-secondary" onclick="closeModal('sessionModal')">취소</button><button class="btn btn-primary" onclick="saveSessions()">${editingSessionId?'저장':'추가 ('+selectedDates.length+'개)'}</button></div>`;
  document.getElementById('sessionForm').innerHTML=h;
}
function toggleDate(ds){if(editingSessionId){selectedDates=[ds]}else{const i=selectedDates.indexOf(ds);if(i>=0){selectedDates.splice(i,1);delete venuePerDate[ds];delete customVenue[ds]}else{selectedDates.push(ds);venuePerDate[ds]='내서스포츠';customVenue[ds]=false}}renderSF()}
function changeVenue(ds,v){
  if(v==='직접입력'){
    customVenue[ds]=true;
    const cur=venuePerDate[ds]||'';
    // 기존 값이 미리 정해둔 장소였다면 비우고, 직접 입력한 값이면 유지
    venuePerDate[ds]=VENUES.includes(cur)?'':cur;
  }else{customVenue[ds]=false;venuePerDate[ds]=v}
  renderSF();
}
function setCV(ds,v){venuePerDate[ds]=v}
function calPrev(){if(calMonth===0){calMonth=11;calYear--}else calMonth--;renderSF()}
function calNext(){if(calMonth===11){calMonth=0;calYear++}else calMonth++;renderSF()}
function saveSessions(){
  if(!selectedDates.length)return alert('날짜를 선택해주세요.');
  // 직접입력을 골랐는데 장소명이 비어 있으면 저장 막기
  const empty=selectedDates.filter(ds=>customVenue[ds]&&!String(venuePerDate[ds]||'').trim());
  if(empty.length)return alert('직접입력을 선택한 날짜의 장소명을 입력해주세요.\n('+empty.map(fmtDate).join(', ')+')');
  const vOf=ds=>String(venuePerDate[ds]||'').trim()||'내서스포츠';
  if(!S.sessions)S.sessions=[];
  if(editingSessionId){const ds=selectedDates[0];S.sessions=S.sessions.map(s=>s.id===editingSessionId?{...s,date:ds,venue:vOf(ds)}:s)}
  else{selectedDates.forEach(ds=>{if(!S.sessions.some(s=>s.date===ds))S.sessions.push({id:genId(),date:ds,venue:vOf(ds)})})}
  saveData();closeModal('sessionModal');render();
}
function deleteSession(){if(!confirm('이 일정을 삭제하시겠습니까?'))return;const sid=editingSessionId;S.sessions=(S.sessions||[]).filter(s=>s.id!==sid);if(S.attendance)Object.keys(S.attendance).forEach(k=>{if(k.endsWith('_'+sid))delete S.attendance[k]});if(S.reasons)Object.keys(S.reasons).forEach(k=>{if(k.endsWith('_'+sid))delete S.reasons[k]});saveData();closeModal('sessionModal');render()}

// ═══ INIT ═══
renderTabs();
</script>
</body>
</html>
